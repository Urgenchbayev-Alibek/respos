name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      admin: ${{ steps.filter.outputs.admin }}
      landing: ${{ steps.filter.outputs.landing }}
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'respos-backend/**'
              - 'respos-contracts/**'
              - '.github/workflows/ci.yml'
            admin:
              - 'respos-admin/**'
              - 'respos-contracts/**'
              - '.github/workflows/ci.yml'
            landing:
              - 'respos-landing/**'
              - '.github/workflows/ci.yml'
            desktop:
              - 'respos-desktop/**'
              - 'respos-admin/**'
              - '.github/workflows/ci.yml'

  file-length:
    name: 500-line rule
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-file-length.mjs

  backend:
    name: Backend (.NET 8)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: respos-backend
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Test (unit + integration via Testcontainers; Docker is available on ubuntu runners)
        run: dotnet test --no-build --configuration Release --logger trx --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: respos-backend/TestResults
          if-no-files-found: ignore

  admin:
    name: Admin app
    needs: changes
    if: needs.changes.outputs.admin == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: respos-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: respos-admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.com/api/v1
          VITE_HUB_URL: https://api.example.com/hubs/restaurant

  landing:
    name: Landing
    needs: changes
    if: needs.changes.outputs.landing == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: respos-landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: respos-landing/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.com/api/v1

  desktop:
    name: Desktop shell (Windows)
    needs: changes
    if: needs.changes.outputs.desktop == 'true' || github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: respos-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            respos-desktop/package-lock.json
            respos-admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      # The shell bundles the admin app: build it the desktop way (same-origin API, no service worker).
      - name: Build the web app for the shell (web-dist)
        run: npm run build:web
        env:
          VITE_LANDING_URL: https://landing.example.com
      # Unpacked app only (release/win-unpacked): proves the electron-builder config, asar and fuses.
      # The unsigned installer and the portable exe are built locally with `npm run dist`.
      - name: Package (electron-builder --dir)
        run: npm run pack
